# Render Blueprint: API + managed Postgres.
# Free plans sleep when idle (first request can take ~1 minute). Use a paid
# "starter" plan for real users.
services:
  - type: web
    name: phishtriageplatform
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: phishtriage-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: FINGERPRINT_SALT
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: RETENTION_DAYS
        value: "180"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

databases:
  - name: phishtriage-db
    plan: basic-256mb
